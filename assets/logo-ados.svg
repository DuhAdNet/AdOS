  <!-- Wordmark -->
  <text x="225" y="112" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="52" font-weight="200" letter-spacing="6" fill="#ffffff">AdOS</text>
  <text x="227" y="142" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="11" font-weight="300" letter-spacing="4" fill="#ffffff" opacity="0.35">AI DESKTOP OPERATING SYSTEM</text>
</svg>
